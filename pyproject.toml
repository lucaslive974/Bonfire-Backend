[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bonfire-backend"
version = "0.1.0"
description = "Bonfire Backend"
requires-python = ">=3.14"
dependencies = [
    "flask",
    "flask-cors",
    "waitress",
    "python-keycloak",
    "pypdf2",
    "python-docx",
    "pandas",
    "openpyxl",
    "sqlalchemy",
    "pymysql",
    "alembic",
    "pyingestion",
    "PyJWT",
    "cryptography",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-flask",
    "ruff",
]

[tool.ruff]
line-length = 88
target-version = "py314" 

[tool.ruff.lint]
select = ["E", "F", "I"]

ignore = [
    "ARG",  
    "E501", 
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101"] # Permite o uso de 'assert' em arquivos de teste

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = "."

[tool.setuptools]
packages = []
py-modules = []
