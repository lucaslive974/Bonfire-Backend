[tool.ruff]
line-length = 88
target-version = "py314" 

[tool.ruff.lint]
select = ["E", "F", "I"]

ignore = [
    "ARG",  
    "E501", 
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101"] # Permite o uso de 'assert' em arquivos de teste

[tool.ruff.format]
quote-style = "double"
indent-style = "space"